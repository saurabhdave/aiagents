name: Update README Version Badge

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update README version badge
        run: |
          sed -i "s/badge\/version-[0-9.]*-green/badge\/version-${{ steps.version.outputs.VERSION }}-green/g" README.md

      - name: Create pull request for README badge update
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update README version badge to v${{ steps.version.outputs.VERSION }}"
          title: "chore: update README version badge to v${{ steps.version.outputs.VERSION }}"
          body: |
            Auto-generated update to sync the README version badge with tag `v${{ steps.version.outputs.VERSION }}`.
          branch: "automation/update-readme-badge-v${{ steps.version.outputs.VERSION }}"
          delete-branch: true
