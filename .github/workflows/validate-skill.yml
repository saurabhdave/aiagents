name: Validate Skill Consistency

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

jobs:
  validate-skill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lint dependencies
        run: npm install

      - name: Lint markdown
        run: npm run lint

      - name: Validate all skill metadata consistency
        run: |
          node <<'NODE'
          const fs = require("fs");

          const semver = /^\d+\.\d+\.\d+$/;
          const manifest = JSON.parse(fs.readFileSync(".claude/manifest.json", "utf8"));
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const agentsText = fs.readFileSync("AGENTS.md", "utf8");

          if (!Array.isArray(manifest.skills) || manifest.skills.length === 0) {
            throw new Error("No skills found in .claude/manifest.json");
          }

          const headerMatch = agentsText.match(/v(\d+\.\d+\.\d+)/);
          if (!headerMatch) {
            throw new Error("Could not find AGENTS.md header version");
          }
          const agentsHeaderVersion = headerMatch[1];
          if (agentsHeaderVersion !== packageJson.version) {
            throw new Error(
              `Package/AGENTS header mismatch: package.json=${packageJson.version}, AGENTS.md=${agentsHeaderVersion}`
            );
          }

          const agentsVersionBySkill = new Map();
          const agentsRegex = /-\s+skill_id:\s*([^\n]+)\n-\s+version:\s*([0-9]+\.[0-9]+\.[0-9]+)/g;
          for (const match of agentsText.matchAll(agentsRegex)) {
            agentsVersionBySkill.set(match[1].trim(), match[2].trim());
          }

          const requiredFields = ["name:", "description:", "version:", "author:", "license:"];
          for (const skill of manifest.skills) {
            if (!skill.id || !skill.entry || !skill.version) {
              throw new Error(`Invalid manifest skill entry: ${JSON.stringify(skill)}`);
            }
            if (!semver.test(skill.version)) {
              throw new Error(`Manifest version is not semver for ${skill.id}: ${skill.version}`);
            }
            if (!fs.existsSync(skill.entry)) {
              throw new Error(`Skill entry missing for ${skill.id}: ${skill.entry}`);
            }

            const skillText = fs.readFileSync(skill.entry, "utf8");
            for (const field of requiredFields) {
              if (!new RegExp(`(^|\\n)\\s*${field}`).test(skillText)) {
                throw new Error(`Missing ${field} in ${skill.entry}`);
              }
            }

            const skillNameMatch = skillText.match(/(?:^|\n)\s*name:\s*([^\n]+)/);
            if (!skillNameMatch) {
              throw new Error(`Missing name value in ${skill.entry}`);
            }
            const skillName = skillNameMatch[1].trim();
            if (skillName !== skill.id) {
              throw new Error(
                `Skill id/name mismatch for ${skill.id}: SKILL.md has ${skillName}`
              );
            }

            const skillVersionMatch = skillText.match(/(?:^|\n)\s*version:\s*([0-9]+\.[0-9]+\.[0-9]+)/);
            if (!skillVersionMatch) {
              throw new Error(`Missing semver version in ${skill.entry}`);
            }
            const skillVersion = skillVersionMatch[1];
            if (skillVersion !== skill.version) {
              throw new Error(
                `Manifest/SKILL version mismatch for ${skill.id}: manifest=${skill.version}, SKILL.md=${skillVersion}`
              );
            }

            const agentsVersion = agentsVersionBySkill.get(skill.id);
            if (!agentsVersion) {
              throw new Error(`Missing AGENTS.md registry entry for skill_id: ${skill.id}`);
            }
            if (agentsVersion !== skill.version) {
              throw new Error(
                `AGENTS/manifest version mismatch for ${skill.id}: AGENTS.md=${agentsVersion}, manifest=${skill.version}`
              );
            }
          }

          console.log(`Validated ${manifest.skills.length} skills across SKILL.md, manifest, and AGENTS.md.`);
          NODE

      - name: Validate tag matches package version (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          AGENTS_HEADER_VERSION=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' AGENTS.md | sed 's/^v//')

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version does not match package.json version"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$AGENTS_HEADER_VERSION" ]; then
            echo "Tag version does not match AGENTS.md header version"
            exit 1
          fi

      - name: Success
        run: echo "All skill validation checks passed."
